# ============================================================
# LoCoMo Benchmark Experiment Configuration
# All paths are relative to the HESM project root (d:/code/hesm)
# ============================================================

experiment:
  name: locomo_benchmark
  seed: 42
  # null = run all 10 conversations; set to int to limit (e.g. 2 for quick test)
  max_conversations: null

# ── Dataset ─────────────────────────────────────────────────
dataset:
  path: data/locomo10.json

# ── Output paths ────────────────────────────────────────────
output:
  root: outputs/locomo
  memory: outputs/locomo/memory      # isolated SQLite + Chroma per method×conv
  answers: outputs/locomo/answers    # per-question QA records (JSON)
  metrics: outputs/locomo/metrics    # per-method aggregated metrics (JSON)
  tables: outputs/locomo/tables      # final result tables (MD / CSV / JSON)
  logs: outputs/locomo/logs          # four-stage, per-method structured logs

# ── Retrieval settings ───────────────────────────────────────
retrieval:
  top_k_values: [1, 3, 5]   # K values for Recall/Precision/Accuracy@K
  default_top_k: 5           # used for context injection into LLM

# ── Model configuration ─────────────────────────────────────
# Model roles are configured independently in configs/config.yaml:
# topic_extraction, answer_generation, retrieval, summarization, evaluation, embedding.
llm:
  config_path: configs/config.yaml

# ── Token counting ────────────────────────────────────────────
token_counter:
  encoding: cl100k_base   # tiktoken encoding compatible with GPT-4 family

# ── Methods to run ──────────────────────────────────────────
methods:
  # Optional run_main-only upper bound; run_all intentionally excludes it.
  full_context:
    enabled: true
  vector_rag:
    enabled: true
  mem0:
    enabled: true
  amem:
    enabled: true
  hesm:
    enabled: true

# ── HESM-specific settings ───────────────────────────────────
hesm:
  segment_qa_threshold: 5       # trigger segment summary every N new QAs
  experience_segment_threshold: 5  # trigger experience summary every N new segments
  top_experience: 2
  top_segment: 3
  top_qa: 8
  use_llm_summarizer: true      # true=LLMSummarizer; false=TemplateSummarizer
  use_llm_reranker: true        # true=LLMRetrievalReranker; false=vector-only

# ── Mem0 settings ───────────────────────────────────────────
mem0:
  # Mem0 uses the same embedding config (from configs/config.yaml [embedding])
  # and topic_extraction config for its LLM
  collection_prefix: mem0_locomo  # Chroma collection name prefix

# ── A-MEM settings ──────────────────────────────────────────
amem:
  # A-MEM implemented from scratch (paper algorithm)
  # Uses topic_extraction LLM for keyword extraction
  # Uses embedding config for vector similarity
  top_related: 5   # number of related memories to link when adding
  link_threshold: 0.7  # minimum similarity to create a memory link

# ── Part 2: Ablation study ──────────────────────────────────
ablation:
  # Reuses HESM SQLite/Chroma built during Part 1 (same conv_id)
  # Only differs in retrieval strategy – no rebuild needed
  variants:
    flat_memory:
      description: "Direct vector search on raw turns; no TopicExtractor"
      use_topic_extractor: false
      retrieval_layers: [qa_direct]   # raw turn vectors, flat ChromaDB query
    qa_only:
      description: "HESM QA layer only; direct Chroma query on QA vectors"
      use_topic_extractor: false
      retrieval_layers: [qa]
    qa_segment:
      description: "HESM QA + Segment layers; merged vector results"
      use_topic_extractor: false
      retrieval_layers: [qa, segment]
    full_hesm_no_reranker:
      description: "Full hierarchical retrieval without LLM reranking"
      use_topic_extractor: true
      use_llm_reranker: false
      retrieval_layers: [experience, segment, qa]
    full_hesm:
      description: "Full HESM hierarchical retrieval (Experience→Segment→QA)"
      use_topic_extractor: true
      use_llm_reranker: true
      retrieval_layers: [experience, segment, qa]

# ── Part 3: Cache evaluation ────────────────────────────────
cache_eval:
  cache_types: [memory, embedding]
  # memory cache  → HybridRetriever use_cache=True/False
  # embedding cache → CachedEmbedder wrapper around BailianEmbedder
  num_latency_samples: 50   # number of questions used for latency measurement
  percentiles: [50, 90, 99] # P50 / P90 / P99
