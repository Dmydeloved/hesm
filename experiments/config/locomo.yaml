# ============================================================

# Experiment-owned model configuration. Experiment code reads this file only;
# it never imports or loads config/hesm.yaml.
_llm_connection: &experiment_llm_connection
  api_key: "sk-RFUNAF0b6zfJWCVz9dA1Aa244aEa43Dc974693370b8d4338"
  base_url: https://api.gpt.ge/v1/
  max_retries: 3
  retry_delay: 2.0

_llm_profiles:
  strong: &experiment_strong_llm
    <<: *experiment_llm_connection
    model: gpt-5.6-sol
  nano: &experiment_nano_llm
    <<: *experiment_llm_connection
    model: gpt-5.4-nano-high
  judge: &experiment_judge_llm
    <<: *experiment_llm_connection
    model: gpt-5.4-mini

topic_extraction: *experiment_nano_llm
answer_generation: *experiment_judge_llm
summarization: *experiment_strong_llm
evaluation: *experiment_judge_llm

embedding: &experiment_embedding
  api_key: "sk-29434e233c3e437281144cd9e2a1f04f"
  model: text-embedding-v4
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

memory_methods:
  mem0:
    llm: *experiment_nano_llm
    embedding: *experiment_embedding
  amem:
    llm: *experiment_nano_llm
    embedding: *experiment_embedding
  hesm:
    topic_extraction: *experiment_nano_llm
    summarization: *experiment_nano_llm
    retrieval: *experiment_nano_llm
    embedding: *experiment_embedding
# LoCoMo Benchmark Experiment Configuration
# All paths are relative to the HESM project root (d:/code/hesm)
# ============================================================

experiment:
  name: locomo_benchmark
  seed: 42
  # null = run all 10 conversations; set to int to limit (e.g. 2 for quick test)
  max_conversations: null

# ── Concurrency ─────────────────────────────────────────────
concurrency:
  # Keep methods serial by default so latency comparisons do not contend for
  # the same API/network resources. Increase explicitly for throughput runs.
  method_workers: 4
  # Queries run concurrently after a conversation memory is fully built.
  # Each worker owns its memory reader, answer client, and Judge client.
  qa_workers: 4

# ── Dataset ─────────────────────────────────────────────────
dataset:
  path: data/locomo10.json

# ── Output paths ────────────────────────────────────────────
output:
  root: experiments/outputs/locomo
  memory: experiments/outputs/locomo/memory
  answers: experiments/outputs/locomo/answers
  metrics: experiments/outputs/locomo/metrics
  tables: experiments/outputs/locomo/tables
  logs: experiments/outputs/locomo/logs

# ── Retrieval settings ───────────────────────────────────────
retrieval:
  top_k_values: [1, 3, 5]   # K values for Recall/Precision/Accuracy@K
  default_top_k: 5           # used for context injection into LLM

# ── Model configuration ─────────────────────────────────────
# ── Token counting ────────────────────────────────────────────
token_counter:
  encoding: cl100k_base   # tiktoken encoding compatible with GPT-4 family

# ── Methods to run ──────────────────────────────────────────
methods:
  # Optional run_main-only upper bound; run_all intentionally excludes it.
  full_context:
    enabled: true
  vector_rag:
    enabled: true
  mem0:
    enabled: true
  amem:
    enabled: true
  hesm:
    enabled: true

# ── HESM-specific settings ───────────────────────────────────
hesm:
  segment_qa_threshold: 5       # trigger segment summary every N new QAs
  experience_segment_threshold: 5  # trigger experience summary every N new segments
  top_experience: 2
  top_segment: 3
  top_qa: 8
  use_llm_summarizer: true      # true=LLMSummarizer; false=TemplateSummarizer
  use_llm_reranker: true        # true=LLMRetrievalReranker; false=vector-only
  qa_full_search_confidence_threshold: 0.8
  experience_vector_recall_limit: 12
  experience_relational_recall_limit: 12
  experience_candidate_limit: 8
  scoped_segment_vector_limit: 32
  scoped_qa_vector_limit: 64
  qa_rescue_vector_limit: 40
  qa_rescue_relational_limit: 40
  max_context_tokens: 30000
  min_prompt_experiences: 6
  min_retained_experiences: 1
  min_retained_segments: 2
  summary_soft_experience_chars: 800
  summary_soft_segment_chars: 400
  summary_extreme_experience_chars: 300
  summary_extreme_segment_chars: 160
  token_encoding: cl100k_base

# ── Mem0 settings ───────────────────────────────────────────
mem0:
  # LLM/embedding: experiments/config/locomo.yaml [memory_methods.mem0]
  collection_prefix: mem0_locomo  # Chroma collection name prefix

# ── A-MEM settings ──────────────────────────────────────────
amem:
  # A-MEM implemented from scratch (paper algorithm)
  # LLM/embedding: experiments/config/locomo.yaml [memory_methods.amem]
  top_related: 5   # number of related memories to link when adding
  link_threshold: 0.7  # minimum similarity to create a memory link

# ── Part 2: Ablation study ──────────────────────────────────
ablation:
  # Reuses HESM SQLite/Chroma built during Part 1 (same conv_id)
  # Only differs in retrieval strategy – no rebuild needed
  variants:
    flat_memory:
      description: "Direct vector search on raw turns; no TopicExtractor"
      use_topic_extractor: false
      retrieval_layers: [qa_direct]   # raw turn vectors, flat ChromaDB query
    qa_only:
      description: "HESM QA layer only; direct Chroma query on QA vectors"
      use_topic_extractor: false
      retrieval_layers: [qa]
    qa_segment:
      description: "HESM QA + Segment layers; merged vector results"
      use_topic_extractor: false
      retrieval_layers: [qa, segment]
    full_hesm_no_reranker:
      description: "Full hierarchical retrieval without LLM reranking"
      use_topic_extractor: true
      use_llm_reranker: false
      retrieval_layers: [experience, segment, qa]
    full_hesm:
      description: "Full HESM hierarchical retrieval (Experience→Segment→QA)"
      use_topic_extractor: true
      use_llm_reranker: true
      retrieval_layers: [experience, segment, qa]

# ── Part 3: Cache evaluation ────────────────────────────────
cache_eval:
  cache_types: [memory, embedding]
  # memory cache  → HybridRetriever use_cache=True/False
  # embedding cache → CachedEmbedder wrapper around BailianEmbedder
  num_latency_samples: 50   # number of questions used for latency measurement
  percentiles: [50, 90, 99] # P50 / P90 / P99
