dataset:
  name: multiwoz
  path: data/topic_extracted/multiwoz_2.2_with_topics_1.jsonl
  limit: 20

method:
  name: hesm
  top_experience: 3
  top_segment: 5
  top_qa: 8
  rerank: heuristic

run:
  output_dir: results/experiments/multiwoz_smoke_hesm
  seed: 42
  max_context_tokens: 4096
  progress_interval: 1
  log_node_inputs: true

