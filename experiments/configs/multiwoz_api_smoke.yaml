dataset:
  name: multiwoz
  path: data/topic_extracted/multiwoz_2.2_with_topics_1.jsonl
  limit: 0
  dialogue_limit: 1

method:
  name: hesm
  embedder: bailian
  embedding_api_key_env: DASHSCOPE_API_KEY
  embedding_model: text-embedding-v4
  embedding_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  rerank: llm
  retrieval_api_key_env: EVALUATION_API_KEY
  retrieval_model: gpt-5.5
  retrieval_base_url: https://api.gpt.ge/v1/
  retrieval_max_retries: 3
  retrieval_retry_delay: 2.0
  top_experience: 3
  top_segment: 5
  top_qa: 8

generation:
  enabled: true
  api_key_env: EVALUATION_API_KEY
  model: gpt-5.5
  base_url: https://api.gpt.ge/v1/
  temperature: 0.0

topic_extraction:
  enabled: true
  api_key_env: EVALUATION_API_KEY
  model: gpt-5.5
  base_url: https://api.gpt.ge/v1/
  max_retries: 3
  retry_delay: 2.0
  history_size: 5
  domain_knowledge: ""

judge:
  enabled: true
  api_key_env: EVALUATION_API_KEY
  model: gpt-5.5
  base_url: https://api.gpt.ge/v1/
  temperature: 0.0

run:
  output_dir: results/experiments/multiwoz_api_smoke_hesm
  seed: 42
  max_context_tokens: 4096
  progress_interval: 1
  log_node_inputs: true
