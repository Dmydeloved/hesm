paths:
  raw_multiwoz: data/raw/multiwoz_2.2
  processed_dialogues: data/processed/multiwoz_2.2_scene_dialogue_10000.jsonl
  topic_output: data/topic_extracted/multiwoz_2.2_with_topics.jsonl
  topic_checkpoint: data/topic_extracted/multiwoz_2.2_checkpoint.json
  topic_failures: data/topic_extracted/multiwoz_2.2_failures.jsonl
  memory_db: outputs/locomo/memory/hesm_conv-26/memory.sqlite3
  chroma: outputs/locomo/memory/hesm_conv-26/chroma
  benchmark: data/benchmark/topic_memory_benchmark.jsonl
  retrieval_details: data/benchmark/retrieval_details.jsonl
  retrieval_summary: data/benchmark/retrieval_summary.json
  end_to_end_details: data/benchmark/end_to_end_details.jsonl
  end_to_end_summary: data/benchmark/end_to_end_summary.json

# Shared provider settings. Role/method sections below only select a model.
_llm_connection: &llm_connection
  api_key: "sk-RFUNAF0b6zfJWCVz9dA1Aa244aEa43Dc974693370b8d4338"
  base_url: https://api.gpt.ge/v1/
  max_retries: 3
  retry_delay: 2.0

_llm_profiles:
  strong: &strong_llm
    <<: *llm_connection
    model: gpt-5.6-sol
  nano: &nano_llm
    <<: *llm_connection
    model: gpt-5.4-nano-high
  judge: &judge_llm
    <<: *llm_connection
    model: gpt-5.4-mini

topic_extraction: *nano_llm
answer_generation: *judge_llm

embedding: &embedding_defaults
  api_key: "sk-29434e233c3e437281144cd9e2a1f04f"
  model: text-embedding-v4
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

retrieval:
  # Retrieval-specific tuning extends the shared nano LLM profile.
  <<: *nano_llm
  top_experience: 2
  top_segment: 3
  top_qa: 8
  qa_full_search_confidence_threshold: 0.8
  experience_vector_recall_limit: 12
  experience_relational_recall_limit: 12
  experience_candidate_limit: 8
  scoped_segment_vector_limit: 32
  scoped_qa_vector_limit: 64
  qa_rescue_vector_limit: 40
  qa_rescue_relational_limit: 40
  max_context_tokens: 30000
  min_retained_experiences: 1
  min_retained_segments: 2
  summary_soft_experience_chars: 800
  summary_soft_segment_chars: 400
  summary_extreme_experience_chars: 300
  summary_extreme_segment_chars: 160
  token_encoding: cl100k_base

summarization: *strong_llm
evaluation: *judge_llm

# Each benchmark method keeps an explicit config path while reusing profiles.
memory_methods:
  mem0:
    llm: *nano_llm
    embedding: *embedding_defaults
  amem:
    llm: *nano_llm
    embedding: *embedding_defaults
  hesm:
    topic_extraction: *nano_llm
    summarization: *nano_llm
    retrieval: *nano_llm
    embedding: *embedding_defaults
