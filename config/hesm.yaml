# paths:
#   memory_db: memory/hesm.sqlite3
#   chroma: memory/chroma

identity:
  default_user_id: default
paths:
  memory_db: experiments/.runtime/evidence_topic_retrieval_v2/smoke_evidence_topic_fallback_v2_locomo_030f8f726969f299/users/c1b93c6dcc9f6f32ad9451c56d7a6da749e547dfe74f24f9c10f984c62b31f0c/hesm.sqlite3
  chroma: experiments/.runtime/evidence_topic_retrieval_v2/smoke_evidence_topic_fallback_v2_locomo_030f8f726969f299/users/c1b93c6dcc9f6f32ad9451c56d7a6da749e547dfe74f24f9c10f984c62b31f0c/chroma

# Production HESM provider settings. This file is never read by experiments.
_llm_connection: &llm_connection
  api_key: "sk-IXbHAW109t16ciajF2B5Bd4e75E34a0a8112DbAa2dF828Fa"
  base_url: https://api.gpt.ge/v1/
  max_retries: 3
  retry_delay: 2.0

_llm_profiles:
  strong: &strong_llm
    <<: *llm_connection
    model: gpt-5.6-sol
  nano: &nano_llm
    <<: *llm_connection
    model: gpt-5.4-nano-high
topic_extraction: *strong_llm

embedding: &embedding_defaults
  api_key: "sk-29434e233c3e437281144cd9e2a1f04f"
  model: text-embedding-v4
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

retrieval:
  # Completed-Experience recall only: SQLite relation path + Chroma path.
  experience_vector_recall_limit: 12
  experience_relational_recall_limit: 12
  experience_similarity_threshold: 0.82
  # Vector-route ambiguity and QA hybrid fallback (dense + SQLite fields).
  experience_route_margin: 0.05
  qa_candidate_limit: 40
  qa_similarity_threshold: 0.45

summarization: *strong_llm

# Final answer generation for the Web Console chat page.
chat: *nano_llm

memory_management:
  segment_qa_threshold: 5
  # Summarize Experience after this many not-yet-consumed Segment updates.
  experience_segment_threshold: 2
  experience_similarity_threshold: 0.82
  # Segment write routing uses semantic consistency, not a minimum-size bypass.
  segment_similarity_threshold: 0.8
  segment_route_margin: 0.1
  segment_route_window: 5
  # QA vectors stay synchronous; aggregate parent updates and vectors use outbox.
  async_derivation: true
  async_poll_interval: 0.5
  async_batch_size: 8
  async_max_retries: 3

api:
  top_experience: 1
  # These caps apply to QA fallback candidate/result shaping only. Normal
  # hierarchy retrieval is bounded by last_updated_segment_id/last_updated_qa_id.
  top_segment: 2
  top_qa: 4
