paths:
  memory_db: memory/hesm.sqlite3
  chroma: memory/chroma

# Production HESM provider settings. This file is never read by experiments.
_llm_connection: &llm_connection
  api_key: "sk-RFUNAF0b6zfJWCVz9dA1Aa244aEa43Dc974693370b8d4338"
  base_url: https://api.gpt.ge/v1/
  max_retries: 3
  retry_delay: 2.0

_llm_profiles:
  strong: &strong_llm
    <<: *llm_connection
    model: gpt-5.6-sol
  nano: &nano_llm
    <<: *llm_connection
    model: gpt-5.4-nano-high
topic_extraction: *nano_llm

embedding: &embedding_defaults
  api_key: "sk-29434e233c3e437281144cd9e2a1f04f"
  model: text-embedding-v4
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

retrieval:
  # Retrieval-specific tuning extends the shared nano LLM profile.
  <<: *nano_llm
  qa_full_search_confidence_threshold: 0.8
  experience_vector_recall_limit: 12
  experience_relational_recall_limit: 12
  experience_candidate_limit: 8
  scoped_segment_vector_limit: 32
  scoped_qa_vector_limit: 64
  qa_rescue_vector_limit: 40
  qa_rescue_relational_limit: 40
  max_context_tokens: 30000
  min_retained_experiences: 1
  min_retained_segments: 2
  summary_soft_experience_chars: 800
  summary_soft_segment_chars: 400
  summary_extreme_experience_chars: 300
  summary_extreme_segment_chars: 160
  token_encoding: cl100k_base

summarization: *strong_llm

memory_management:
  segment_qa_threshold: 5
  experience_segment_threshold: 5
  experience_similarity_threshold: 0.82
  min_segment_qas: 2

api:
  top_experience: 2
  top_segment: 3
  top_qa: 8
