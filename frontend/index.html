<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HESM Experience、Segment、QA 在线数据管理">
  <title>HESM · 数据管理</title>
  <link rel="stylesheet" href="/styles.css?v=5">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/index.html"><span class="brand-icon">H</span><span>HESM<small>Hierarchical Episodic & Semantic Memory</small></span></a>
    <nav><a class="active" href="/index.html">数据管理</a><a href="/retrieval.html">检索分析</a><a href="/chat.html?v=6">智能对话</a></nav>
    <div id="health" class="health"><i></i><span>正在连接</span></div>
  </header>

  <main class="page-shell">
    <section class="page-intro">
      <div><p class="eyebrow">MEMORY OPERATIONS</p><h1>数据管理</h1><p>实时查看和管理 HESM 的三层记忆结构。</p></div>
      <button id="refresh" class="button secondary">刷新数据</button>
    </section>

    <section id="stats" class="stats">
      <article><span class="level e">E</span><div><small>EXPERIENCE</small><strong>—</strong><p>长期主题记忆</p></div></article>
      <article><span class="level s">S</span><div><small>SEGMENT</small><strong>—</strong><p>阶段与意图</p></div></article>
      <article><span class="level q">Q</span><div><small>QA MEMORY</small><strong>—</strong><p>原始对话证据</p></div></article>
    </section>

    <section class="manager-card">
      <div class="manager-toolbar">
        <div id="level-tabs" class="tabs">
          <button class="active" data-level="experience">Experience</button>
          <button data-level="segment">Segment</button>
          <button data-level="qa">QA</button>
        </div>
        <label class="search"><span>⌕</span><input id="search" placeholder="搜索 ID、主题、实体或内容…"></label>
        <select id="status"><option value="">全部状态</option></select>
      </div>

      <div id="context-bar" class="context-bar" hidden></div>
      <div class="table-wrap">
        <table><thead id="table-head"></thead><tbody id="table-body"></tbody></table>
        <div id="empty" class="empty" hidden><span>◇</span><h3>暂无数据</h3><p>当前筛选条件下没有可显示的记忆。</p></div>
      </div>
      <footer class="pager"><span id="page-info">—</span><div><button id="prev">上一页</button><button id="next">下一页</button></div></footer>
    </section>
  </main>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-label="记忆详情" aria-hidden="true">
    <header><div><p class="eyebrow" id="drawer-level">MEMORY DETAIL</p><h2 id="drawer-title">记忆详情</h2></div><button id="drawer-close" class="icon-button">×</button></header>
    <div id="drawer-content" class="drawer-content"></div>
  </aside>
  <div id="toast" class="toast"></div>
  <script src="/app.js?v=6"></script>
</body>
</html>
